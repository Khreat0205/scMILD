# scMILD Configuration - SCP1884 (CD Classification)
# ===================================================
# CD 18 samples / Ctrl 16 samples = 34 total samples
# Study: SCP1884
# python scripts/02_train_cv.py --config config/scp1884_skfold_512_celltype.yaml --gpu 0
# python scripts/06_tune_hyperparams.py --config config/skin3_skfold_512_celltype.yaml --gpu 0
# python scripts/06_tune_hyperparams.py --config config/scp1884_skfold_512_celltype.yaml --gpu 0

# 기본 설정 상속
_base_: "pretrain_celltype_aux.yaml"

# ============================================================================
# SCP1884 특화 경로
# ============================================================================
paths:
  # 결과 저장 경로 (scp1884 전용)
  output_root: "${paths.project_root}/results/scp1884_skfold_512_celltype"

# ============================================================================
# SCP1884 데이터 설정
# ============================================================================
data:
  # Subset 설정 - SCP1884 study만 필터링
  subset:
    enabled: true
    column: "study"
    values:
      - "SCP1884"

  # 데이터셋 정보 (참고용)
  info:
    name: "SCP1884"
    disease: "CD"  # Crohn's Disease
    control_status: "ctrl_colon"
    disease_status: "CD"
    n_samples: 34
    n_disease: 18
    n_control: 16
    n_cells: 289730

# ============================================================================
# LOOCV 설정 (34 folds)
# ============================================================================
splitting:
  strategy: "stratified_kfold"

# ============================================================================
# MIL 학습 설정 (SCP1884 최적화)
# ============================================================================
mil:
  latent_dim: 128

  training:
    learning_rate: 0.0001
    encoder_learning_rate: 0.0001
    epochs: 100 # 50 쓰는게 맞음 한번 테스트해보기
    use_early_stopping: false

  # SCP1884는 세포 수가 많아서 subsampling 고려
  subsampling:
    enabled: true
    max_cells_per_sample: 5000

tuning:
  learning_rate: [0.001, 0.0001]
  encoder_learning_rate: [0.0001]
  epochs: [50]
  disease_ratio_lambda: [0.0, 0.1]
  metric: "auc"
  results_file: "tuning_results.csv"
  save_top_k: 3
